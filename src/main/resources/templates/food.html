<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>음식 검색 - 뭐먹을수있지?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; background: #f5f5f5; }
        .hero { background: #3d7a3d; padding: 20px 32px; }
        .hero-title { color: white; font-size: 16px; font-weight: bold; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .hero-title::before { content: '●'; color: #f5a623; }
        .search-bar { display: flex; }
        .search-bar input { flex: 1; padding: 14px 18px; border: none; border-radius: 8px 0 0 8px; font-size: 15px; outline: none; }
        .search-bar button { background: #f5a623; color: white; border: none; padding: 14px 28px; border-radius: 0 8px 8px 0; font-size: 15px; font-weight: bold; cursor: pointer; }
        .content { max-width: 900px; margin: 32px auto; padding: 0 24px; }
        .section-title { font-size: 15px; font-weight: bold; color: #333; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .clear-btn { font-size: 13px; color: #f5a623; cursor: pointer; text-decoration: none; }
        .recent-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
        .recent-item-left { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #333; cursor: pointer; }
        .recent-item-left::before { content: '🕐'; font-size: 14px; }
        .remove-btn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px; }
        .popular-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .popular-tag { background: white; border: 1px solid #ddd; color: #555; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; }
        .popular-tag:hover { border-color: #3d7a3d; color: #3d7a3d; }
        .divider { border: none; border-top: 1px solid #eee; margin: 28px 0; }

        /* 로딩 오버레이 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #f5f5f5;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .loading-overlay.show { display: flex; }
        .loading-spinner {
            width: 60px; height: 60px;
            border: 5px solid #e0e0e0;
            border-top-color: #3d7a3d;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 18px; font-weight: bold; color: #333; }
        .loading-sub { font-size: 13px; color: #888; text-align: center; line-height: 1.8; }
    </style>
</head>
<body>

<!-- 로딩 오버레이 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">검색 중...</div>
    <div class="loading-sub" id="loadingSub"></div>
</div>

<div class="hero">
    <div class="hero-title">음식 검색</div>
    <form id="searchForm" action="/food/loading" method="get">
        <div class="search-bar">
            <input type="text" id="keywordInput" name="keyword"
                   placeholder="먹고 싶은 음식을 검색하세요 (예: 비빔밥, 된장찌개)" required/>
            <button type="submit">검색</button>
        </div>
    </form>
</div>

<div class="content">
    <div class="section-title">
        최근 검색어
        <a href="#" class="clear-btn">전체 삭제</a>
    </div>
    <div id="recentList">
        <div class="recent-item">
            <div class="recent-item-left" onclick="search('비빔밥')">비빔밥</div>
            <button class="remove-btn">×</button>
        </div>
        <div class="recent-item">
            <div class="recent-item-left" onclick="search('된장찌개')">된장찌개</div>
            <button class="remove-btn">×</button>
        </div>
        <div class="recent-item">
            <div class="recent-item-left" onclick="search('제육볶음')">제육볶음</div>
            <button class="remove-btn">×</button>
        </div>
        <div class="recent-item">
            <div class="recent-item-left" onclick="search('김치찌개')">김치찌개</div>
            <button class="remove-btn">×</button>
        </div>
    </div>

    <hr class="divider"/>

    <div class="section-title">인기 검색어</div>
    <div class="popular-tags">
        <span class="popular-tag" onclick="search('비빔밥')">비빔밥</span>
        <span class="popular-tag" onclick="search('된장찌개')">된장찌개</span>
        <span class="popular-tag" onclick="search('삼겹살')">삼겹살</span>
        <span class="popular-tag" onclick="search('냉면')">냉면</span>
        <span class="popular-tag" onclick="search('순두부찌개')">순두부찌개</span>
    </div>
</div>

<script>
    function showLoading(keyword) {
        document.getElementById('loadingSub').innerHTML =
            "'" + keyword + "' 관련 식품을 불러오고 있어요<br>알레르기 필터링을 적용하고 있습니다";
        document.getElementById('loadingOverlay').classList.add('show');
    }

    function search(keyword) {
        location.href = '/food/loading?keyword=' + encodeURIComponent(keyword);
    }

    document.getElementById('searchForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const keyword = document.getElementById('keywordInput').value.trim();
        if (!keyword) return;
        location.href = '/food/loading?keyword=' + encodeURIComponent(keyword);
    });
</script>
</body>
</html>
