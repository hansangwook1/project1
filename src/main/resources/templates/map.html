<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>주변 식당 찾기 - 뭐먹을수있지?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; }
        .navbar { background: #3d7a3d; padding: 12px 32px; display: flex; align-items: center; justify-content: space-between; }
        .navbar-left { display: flex; align-items: center; gap: 28px; }
        .navbar-brand { color: white; font-size: 18px; font-weight: bold; text-decoration: none; }
        .navbar-menu a { color: white; text-decoration: none; font-size: 14px; margin-right: 20px; }
        .navbar-menu a.active { border-bottom: 2px solid #f5a623; padding-bottom: 2px; }
        .navbar-right { color: white; font-size: 14px; }
        .search-bar { background: #3d7a3d; padding: 12px 24px; display: flex; align-items: center; gap: 10px; }
        .search-bar input { flex: 1; padding: 11px 16px; border: none; border-radius: 8px; font-size: 14px; outline: none; }
        .map-layout { display: flex; height: calc(100vh - 110px); }
        #map { flex: 1; }
        .sidebar { width: 320px; background: white; overflow-y: auto; border-left: 1px solid #eee; }
        .sidebar-header { padding: 16px 20px; border-bottom: 1px solid #eee; }
        .sidebar-title { font-size: 15px; font-weight: bold; color: #e74c3c; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .sidebar-sub { font-size: 12px; color: #888; }
        .restaurant-item { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; }
        .restaurant-item:hover { background: #f9f9f9; }
        .restaurant-number { width: 24px; height: 24px; background: #3d7a3d; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; margin-top: 2px; }
        .restaurant-name { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        .restaurant-address { font-size: 12px; color: #888; margin-bottom: 3px; }
        .restaurant-distance { font-size: 12px; color: #3d7a3d; font-weight: bold; }
        .loading { text-align: center; padding: 40px 20px; color: #888; font-size: 14px; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-left">
        <a href="/" class="navbar-brand">🥗 뭐먹을수있지?</a>
        <div class="navbar-menu">
            <a href="/">홈</a>
            <a href="/food" class="active">음식 검색</a>
            <a href="/mypage/allergy" sec:authorize="isAuthenticated()">마이페이지</a>
        </div>
    </div>
    <div class="navbar-right" sec:authorize="isAuthenticated()">
        <span sec:authentication="name"></span>님
    </div>
</nav>

<div class="search-bar">
    <input type="text" id="searchInput" th:value="${keyword} + ' 근처 식당'" readonly/>
</div>

<div class="map-layout">
    <div id="map"></div>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">📍 주변 식당</div>
            <div class="sidebar-sub" th:text="${keyword} + ' · 현재 위치 기준'"></div>
        </div>
        <div id="restaurantList">
            <div class="loading">📍 현재 위치를 가져오는 중...</div>
        </div>
    </div>
</div>

<script th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoApiKey}&libraries=services&autoload=false|"></script>
<script th:inline="javascript">
    const keyword = [[${keyword}]];
    let map, ps, markers = [];
    let currentInfoWindow = null;

    kakao.maps.load(function() {
        const mapContainer = document.getElementById('map');
        const mapOption = {center: new kakao.maps.LatLng(37.5665, 126.9780), level: 5};
        map = new kakao.maps.Map(mapContainer, mapOption);
        ps = new kakao.maps.services.Places();

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function (pos) {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const center = new kakao.maps.LatLng(lat, lng);
                map.setCenter(center);

                new kakao.maps.Marker({
                    map: map,
                    position: center,
                    title: '현재 위치'
                });

                searchRestaurants(lat, lng);
            }, function () {
                searchRestaurants(37.5665, 126.9780);
            });
        } else {
            searchRestaurants(37.5665, 126.9780);
        }

        function searchRestaurants(lat, lng) {
            const searchKeyword = keyword + ' 음식점';
            ps.keywordSearch(searchKeyword, function (data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    displayRestaurants(data, lat, lng);
                } else {
                    document.getElementById('restaurantList').innerHTML =
                        '<div class="loading">검색 결과가 없어요.</div>';
                }
            }, {location: new kakao.maps.LatLng(lat, lng), radius: 2000});
        }

        function displayRestaurants(places, myLat, myLng) {
            const listEl = document.getElementById('restaurantList');
            listEl.innerHTML = '';
            markers = [];
            currentInfoWindow = null;

            const bounds = new kakao.maps.LatLngBounds();

            places.forEach(function (place, idx) {
                const position = new kakao.maps.LatLng(place.y, place.x);
                bounds.extend(position);

                const dist = getDistance(myLat, myLng, place.y, place.x);

                const marker = new kakao.maps.Marker({map: map, position: position, title: place.place_name});
                markers.push(marker);

                const infowindow = new kakao.maps.InfoWindow({
                    content: `<div style="padding:8px 12px;font-size:13px;font-weight:bold;">${place.place_name}</div>`
                });

                // 마커 클릭 - 기존 말풍선 닫고 새로 열기
                kakao.maps.event.addListener(marker, 'click', function () {
                    if (currentInfoWindow) currentInfoWindow.close();
                    currentInfoWindow = infowindow;
                    infowindow.open(map, marker);
                });

                const item = document.createElement('div');
                item.className = 'restaurant-item';
                item.innerHTML = `
                <div class="restaurant-number">${idx + 1}</div>
                <div>
                    <div class="restaurant-name">${place.place_name}</div>
                    <div class="restaurant-address">${place.road_address_name || place.address_name}</div>
                    <div class="restaurant-distance">📍 ${dist}m</div>
                </div>
            `;

                // 목록 클릭 - 기존 말풍선 닫고 새로 열기
                item.onclick = function () {
                    map.setCenter(position);
                    if (currentInfoWindow) currentInfoWindow.close();
                    currentInfoWindow = infowindow;
                    infowindow.open(map, marker);
                };

                listEl.appendChild(item);
            });

            map.setBounds(bounds);
        }

        function getDistance(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }
    });
</script>
</body>
</html>
