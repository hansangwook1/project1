<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <!-- [기능1] 찜 API 호출 시 CSRF 토큰을 헤더에 담기 위해 사용 -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>식품 상세 - 뭐먹을수있지?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; background: #f5f5f5; }
        .navbar { background: #3d7a3d; padding: 12px 32px; display: flex; align-items: center; justify-content: space-between; }
        .navbar-left { display: flex; align-items: center; gap: 28px; }
        .navbar-brand { color: white; font-size: 18px; font-weight: bold; text-decoration: none; }
        .navbar-menu a { color: white; text-decoration: none; font-size: 14px; margin-right: 20px; }
        .navbar-menu a.active { border-bottom: 2px solid #f5a623; padding-bottom: 2px; }
        .navbar-right { color: white; font-size: 14px; }
        .breadcrumb { padding: 12px 32px; font-size: 13px; color: #888; border-bottom: 1px solid #eee; background: white; }
        .breadcrumb a { color: #888; text-decoration: none; }
        .breadcrumb a:hover { color: #3d7a3d; }
        .content { max-width: 900px; margin: 28px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 260px; gap: 24px; }
        .main-card { background: white; border-radius: 12px; padding: 28px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .food-title { font-size: 24px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .badge-safe { background: #f0f8f0; color: #3d7a3d; border: 1px solid #3d7a3d; padding: 4px 14px; border-radius: 20px; font-size: 13px; }
        .badge-danger { background: #fff0f0; color: #e74c3c; border: 1px solid #e74c3c; padding: 4px 14px; border-radius: 20px; font-size: 13px; }
        .allergy-notice-safe { background: #f0f8f0; border: 1px solid #3d7a3d; color: #2d5a2d; padding: 14px 18px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; }
        .allergy-notice-danger { background: #fff0f0; border: 1px solid #e74c3c; color: #c0392b; padding: 14px 18px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; }
        .allergy-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .allergy-badge { background: #e74c3c; color: white; padding: 3px 10px; border-radius: 20px; font-size: 12px; }
        .nutrition-title { font-size: 14px; color: #888; margin-bottom: 14px; }
        .nutrition-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .nutrition-card { background: #f9f9f9; border-radius: 10px; padding: 16px; text-align: center; }
        .nutrition-value { font-size: 22px; font-weight: bold; color: #3d7a3d; }
        .nutrition-label { font-size: 12px; color: #888; margin-top: 4px; }
        .nutrition-table { width: 100%; border-collapse: collapse; }
        .nutrition-table tr { border-bottom: 1px solid #f0f0f0; }
        .nutrition-table td { padding: 12px 0; font-size: 14px; }
        .nutrition-table td:last-child { text-align: right; font-weight: bold; }
        .btn-find-restaurant { width: 100%; background: #3d7a3d; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-find-restaurant:hover { background: #2d5a2d; }
        .btn-find-sub { display: block; text-align: center; font-size: 12px; color: #888; margin-top: 6px; }
        .sidebar-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .sidebar-card-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
        .my-allergy-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .my-allergy-tag { background: #f0f0f0; color: #555; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
        .alternative-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #f9f9f9; border-radius: 8px; margin-bottom: 8px; font-size: 13px; cursor: pointer; }
        .alternative-item:hover { background: #f0f8f0; }
        .btn-favorite { width: 100%; background: white; color: #e74c3c; border: 1px solid #e74c3c; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-favorite:hover { background: #fff0f0; }
        .btn-favorite.on { background: #e74c3c; color: white; }
        /* [기능3] 리뷰 */
        .review-card { max-width: 900px; margin: 0 auto 40px; padding: 0 24px; }
        .review-box { background: white; border-radius: 12px; padding: 24px 28px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .review-title { font-size: 16px; font-weight: bold; margin-bottom: 14px; }
        .review-form textarea, .review-edit textarea { width: 100%; min-height: 70px; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; }
        .review-form-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .review-count { font-size: 12px; color: #888; }
        .btn-review { background: #3d7a3d; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .btn-review:hover { background: #2d5a2d; }
        .btn-review-sub { background: white; color: #555; border: 1px solid #ddd; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-left: 4px; }
        .btn-review-sub.danger { color: #e74c3c; border-color: #e74c3c; }
        .review-login { font-size: 13px; color: #888; margin-bottom: 14px; }
        .review-login a { color: #3d7a3d; }
        .review-item { border-top: 1px solid #f0f0f0; padding: 14px 0; }
        .review-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .review-nick { font-size: 13px; font-weight: bold; color: #333; }
        .review-date { font-size: 12px; color: #aaa; margin-left: 8px; font-weight: normal; }
        .review-content { font-size: 14px; color: #444; white-space: pre-wrap; word-break: break-all; }
        .review-empty { font-size: 13px; color: #888; padding: 10px 0; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-left">
        <a href="/" class="navbar-brand">🥗 뭐먹을수있지?</a>
        <div class="navbar-menu">
            <a href="/">홈</a>
            <a href="/food" class="active">음식 검색</a>
            <a href="/mypage/allergy" sec:authorize="isAuthenticated()">마이페이지</a>
        </div>
    </div>
    <div class="navbar-right" sec:authorize="isAuthenticated()">
        <span sec:authentication="name"></span>님
    </div>
</nav>

<div class="breadcrumb">
    <a id="backLink" href="#">← 검색 결과</a>
    / <span th:text="${food != null ? food.foodName : ''}"></span>
</div>

<div class="content" th:if="${food != null}">
    <div class="main-card">
        <div class="food-title">
            <span th:text="${food.foodName}"></span>
            <span th:if="${food.safe}" class="badge-safe">✓ 안전</span>
            <span th:if="${!food.safe}" class="badge-danger">⚠ 위험</span>
        </div>

        <div class="allergy-notice-safe" th:if="${food.safe}">
            ✅ 이 음식은 설정된 알레르기 성분이 포함되어 있지 않아요!
        </div>
        <div class="allergy-notice-danger" th:if="${!food.safe}">
            ⚠ 주의! 알레르기 성분이 포함되어 있어요
            <div class="allergy-badges">
                <span class="allergy-badge" th:each="a : ${food.containedAllergies}" th:text="${a}"></span>
            </div>
        </div>

        <div class="nutrition-title">영양성분 (100g 기준)</div>
        <div class="nutrition-grid">
            <div class="nutrition-card">
                <div class="nutrition-value" th:text="${food.energy}"></div>
                <div class="nutrition-label">열량(kcal)</div>
            </div>
            <div class="nutrition-card">
                <div class="nutrition-value" th:text="${food.protein}"></div>
                <div class="nutrition-label">단백질(g)</div>
            </div>
            <div class="nutrition-card">
                <div class="nutrition-value" th:text="${food.carbohydrate}"></div>
                <div class="nutrition-label">탄수화물(g)</div>
            </div>
        </div>

        <table class="nutrition-table">
            <tr><td>지방</td><td th:text="${food.fat} + ' g'"></td></tr>
            <tr><td>나트륨</td><td th:text="${food.sodium} + ' mg'"></td></tr>
        </table>

        <button class="btn-find-restaurant"
                th:data-foodname="${food.foodName}"
                onclick="goMap(this)">
            🍽 이 음식 파는 식당 찾기
        </button>
        <span class="btn-find-sub">현재 위치 기반으로 주변 식당을 찾아드려요</span>

        <!-- [기능1] 찜 버튼 (로그인한 경우만 표시) -->
        <button type="button" class="btn-favorite" sec:authorize="isAuthenticated()"
                th:classappend="${isFavorite} ? 'on'"
                th:data-foodcode="${food.foodCode}"
                th:data-foodname="${food.foodName}"
                th:data-favorite="${isFavorite}"
                th:text="${isFavorite} ? '♥ 찜 취소' : '♡ 찜하기'"
                onclick="toggleFavorite(this)">♡ 찜하기</button>
    </div>

    <!-- 사이드바 -->
    <div>
        <div class="sidebar-card" th:if="${!userAllergies.isEmpty()}" style="margin-bottom: 16px;">
            <div class="sidebar-card-title" th:if="${food.safe}">✅ 내 알레르기</div>
            <div class="sidebar-card-title" th:if="${!food.safe}" style="color:#e74c3c;">⚠ 포함된 알레르기</div>
            <div class="my-allergy-tags">
                <span class="my-allergy-tag" th:each="a : ${food.safe ? userAllergies : food.containedAllergies}" th:text="${a}"></span>
            </div>
        </div>

        <div class="sidebar-card" th:if="${!alternatives.isEmpty()}">
            <div class="sidebar-card-title">🔄 대체 식품 추천</div>
            <div th:each="alt : ${alternatives}" class="alternative-item"
                 th:data-altcode="${alt.foodCode}"
                 th:data-keyword="${keyword}"
                 onclick="goAlt(this)">
                <div>
                    <div style="font-weight:bold;" th:text="${alt.foodName}"></div>
                    <div style="color:#888;font-size:12px;" th:text="${alt.energy} + 'kcal · 알레르기 성분 없음'"></div>
                </div>
                <span style="color:#3d7a3d;font-size:12px;font-weight:bold;">✓ 안전</span>
            </div>
        </div>
    </div>
</div>

<!-- [기능3] 음식 리뷰 -->
<div class="review-card" th:if="${food != null}">
    <div class="review-box">
        <div class="review-title">💬 리뷰 <span id="reviewTotal" style="font-size:13px; color:#888; font-weight:normal;"></span></div>

        <div class="review-form" sec:authorize="isAuthenticated()">
            <textarea id="reviewInput" maxlength="500" placeholder="이 음식을 먹어본 경험을 남겨주세요 (최대 500자)"></textarea>
            <div class="review-form-bottom">
                <span class="review-count"><span id="reviewLen">0</span> / 500</span>
                <button type="button" class="btn-review" onclick="submitReview()">등록</button>
            </div>
        </div>
        <div class="review-login" sec:authorize="isAnonymous()">
            리뷰를 작성하려면 <a href="/login">로그인</a>해주세요.
        </div>

        <div id="reviewList"><div class="review-empty">불러오는 중...</div></div>
    </div>
</div>

<script th:inline="javascript">
    const keyword = [[${keyword}]];
    const reviewFoodCode = [[${food != null ? food.foodCode : ''}]];   // [기능3]

    // 검색 결과로 돌아가기
    document.getElementById('backLink').href =
        '/food/search?keyword=' + btoa(encodeURIComponent(keyword));

    function goAlt(el) {
        const foodCode = btoa(encodeURIComponent(el.dataset.altcode));
        const kw = btoa(encodeURIComponent(el.dataset.keyword));
        location.href = '/food/detail?foodCode=' + foodCode + '&keyword=' + kw;
    }

    // [기능1] 찜 추가 / 취소
    async function toggleFavorite(btn) {
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
        const isFavorite = btn.dataset.favorite === 'true';
        const foodCode = btn.dataset.foodcode;

        let res;
        if (isFavorite) {
            res = await fetch('/api/favorites/' + encodeURIComponent(foodCode), {
                method: 'DELETE',
                headers: { [csrfHeader]: csrfToken }
            });
        } else {
            res = await fetch('/api/favorites', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify({ foodCode: foodCode, foodName: btn.dataset.foodname })
            });
        }

        if (res.ok) {
            const nowFavorite = !isFavorite;
            btn.dataset.favorite = String(nowFavorite);
            btn.classList.toggle('on', nowFavorite);
            btn.textContent = nowFavorite ? '♥ 찜 취소' : '♡ 찜하기';
        } else {
            const err = await res.json().catch(() => ({}));
            alert(err.message || '처리 중 오류가 발생했습니다.');
        }
    }

    // ===== [기능3] 리뷰 =====
    function csrfHeaders(json) {
        const h = {};
        h[document.querySelector('meta[name="_csrf_header"]').content] = document.querySelector('meta[name="_csrf"]').content;
        if (json) h['Content-Type'] = 'application/json';
        return h;
    }

    function formatDate(value) {
        return value ? value.replace('T', ' ').substring(0, 16) : '';
    }

    async function showError(res) {
        const err = await res.json().catch(() => ({}));
        alert(err.message || '처리 중 오류가 발생했습니다.');
    }

    // 목록 조회 → GET /api/foods/{foodCode}/reviews
    async function loadReviews() {
        const list = document.getElementById('reviewList');
        if (!list) return;
        try {
            const res = await fetch('/api/foods/' + encodeURIComponent(reviewFoodCode) + '/reviews');
            if (!res.ok) throw new Error('status ' + res.status);
            const reviews = await res.json();
            document.getElementById('reviewTotal').textContent = reviews.length + '개';

            if (reviews.length === 0) {
                list.innerHTML = '<div class="review-empty">아직 리뷰가 없어요. 첫 리뷰를 남겨보세요!</div>';
                return;
            }
            list.innerHTML = '';
            reviews.forEach(r => list.appendChild(renderReview(r)));
        } catch (e) {
            list.innerHTML = '<div class="review-empty">리뷰를 불러오지 못했어요.</div>';
        }
    }

    // 리뷰 1개 화면 요소 만들기 (textContent 사용 → 리뷰 내용의 HTML 태그가 실행되지 않음, XSS 방지)
    function renderReview(r) {
        const item = document.createElement('div');
        item.className = 'review-item';
        item.innerHTML =
            '<div class="review-head">' +
            '  <div><span class="review-nick"></span><span class="review-date"></span></div>' +
            '  <div class="review-actions"></div>' +
            '</div>' +
            '<div class="review-content"></div>';
        item.querySelector('.review-nick').textContent = r.nickname;
        item.querySelector('.review-date').textContent =
            formatDate(r.createdAt) + (r.updatedAt ? ' (수정됨)' : '');
        item.querySelector('.review-content').textContent = r.content;

        if (r.mine) {
            const actions = item.querySelector('.review-actions');
            const editBtn = document.createElement('button');
            editBtn.className = 'btn-review-sub';
            editBtn.textContent = '수정';
            editBtn.onclick = () => startEdit(item, r);
            const delBtn = document.createElement('button');
            delBtn.className = 'btn-review-sub danger';
            delBtn.textContent = '삭제';
            delBtn.onclick = () => deleteReview(r.reviewId);
            actions.append(editBtn, delBtn);
        }
        return item;
    }

    // 등록 → POST /api/foods/{foodCode}/reviews
    async function submitReview() {
        const input = document.getElementById('reviewInput');
        const content = input.value.trim();
        if (!content) { alert('리뷰 내용을 입력해주세요.'); return; }

        const res = await fetch('/api/foods/' + encodeURIComponent(reviewFoodCode) + '/reviews', {
            method: 'POST', headers: csrfHeaders(true), body: JSON.stringify({ content: content })
        });
        if (res.ok) {
            input.value = '';
            document.getElementById('reviewLen').textContent = '0';
            loadReviews();
        } else {
            showError(res);
        }
    }

    // 수정 화면으로 전환
    function startEdit(item, r) {
        const box = item.querySelector('.review-content');
        box.innerHTML = '<div class="review-edit"><textarea maxlength="500"></textarea>' +
            '<div style="text-align:right; margin-top:6px;">' +
            '<button class="btn-review-sub" data-act="cancel">취소</button>' +
            '<button class="btn-review" data-act="save" style="margin-left:4px;">저장</button></div></div>';
        const textarea = box.querySelector('textarea');
        textarea.value = r.content;
        box.querySelector('[data-act="cancel"]').onclick = () => loadReviews();
        box.querySelector('[data-act="save"]').onclick = () => updateReview(r.reviewId, textarea.value);
        item.querySelector('.review-actions').style.display = 'none';
    }

    // 수정 → PUT /api/reviews/{reviewId}
    async function updateReview(reviewId, content) {
        if (!content.trim()) { alert('리뷰 내용을 입력해주세요.'); return; }
        const res = await fetch('/api/reviews/' + reviewId, {
            method: 'PUT', headers: csrfHeaders(true), body: JSON.stringify({ content: content.trim() })
        });
        if (res.ok) loadReviews(); else showError(res);
    }

    // 삭제 → DELETE /api/reviews/{reviewId}
    async function deleteReview(reviewId) {
        if (!confirm('리뷰를 삭제할까요?')) return;
        const res = await fetch('/api/reviews/' + reviewId, { method: 'DELETE', headers: csrfHeaders(false) });
        if (res.ok) loadReviews(); else showError(res);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('reviewInput');
        if (input) input.addEventListener('input', () => {
            document.getElementById('reviewLen').textContent = input.value.length;
        });
        if (reviewFoodCode) loadReviews();
    });

    function goMap(el) {
        const kw = btoa(encodeURIComponent(el.dataset.foodname));
        location.href = '/map?keyword=' + kw;
    }
</script>
</body>
</html>
