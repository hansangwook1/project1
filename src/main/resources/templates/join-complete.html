<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>가입 완료 - 뭐먹을수있지?</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Malgun Gothic', sans-serif; background: #f5f5f5; }
    .navbar {
      background-color: #3d7a3d; padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .navbar-left { display: flex; align-items: center; gap: 24px; }
    .navbar-brand { color: white; font-size: 18px; font-weight: bold; text-decoration: none; }
    .navbar-menu a { color: white; text-decoration: none; font-size: 14px; margin-right: 16px; }
    .wrapper {
      display: flex; justify-content: center; align-items: center;
      min-height: calc(100vh - 52px); padding: 40px 16px;
    }
    .card {
      background: white; border-radius: 16px; padding: 48px 40px;
      width: 100%; max-width: 520px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    /* 스텝 */
    .steps { display: flex; align-items: center; justify-content: center; margin-bottom: 36px; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .step-circle {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: bold;
    }
    .step.done .step-circle { background: #3d7a3d; color: white; }
    .step.active .step-circle { background: #3d7a3d; color: white; }
    .step-label { font-size: 12px; color: #999; }
    .step.active .step-label { color: #3d7a3d; font-weight: bold; }
    .step-line { width: 60px; height: 2px; background: #3d7a3d; margin-bottom: 18px; }

    .complete-icon { font-size: 56px; margin-bottom: 16px; }
    .complete-title { font-size: 22px; font-weight: bold; color: #2d5a2d; margin-bottom: 8px; }
    .complete-subtitle { font-size: 14px; color: #888; margin-bottom: 24px; line-height: 1.6; }

    .allergy-summary {
      background: #f9f9f9; border-radius: 10px; padding: 16px 20px;
      text-align: left; margin-bottom: 28px; font-size: 13px; color: #555; line-height: 2;
    }
    .allergy-summary span { color: #3d7a3d; font-weight: bold; }

    .btn-start {
      width: 100%; background: #3d7a3d; color: white; border: none;
      padding: 14px; border-radius: 8px; font-size: 16px;
      font-weight: bold; cursor: pointer;
    }
    .btn-start:hover { background: #2d5a2d; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-left">
    <a href="/" class="navbar-brand">🥗 뭐먹을수있지?</a>
    <div class="navbar-menu"><a href="/">홈</a></div>
  </div>
</nav>

<div class="wrapper">
  <div class="card">
    <div class="steps">
      <div class="step done">
        <div class="step-circle">✓</div>
        <div class="step-label">기본 정보</div>
      </div>
      <div class="step-line"></div>
      <div class="step done">
        <div class="step-circle">✓</div>
        <div class="step-label">알레르기 설정</div>
      </div>
      <div class="step-line"></div>
      <div class="step active">
        <div class="step-circle">3</div>
        <div class="step-label">가입 완료</div>
      </div>
    </div>

    <div class="complete-icon">🎉</div>
    <div class="complete-title">회원가입이 완료되었어요!</div>
    <div class="complete-subtitle">
      알레르기 안심 식품 검색 서비스를<br>지금 바로 이용해보세요.
    </div>

    <button class="btn-start" onclick="location.href='/login'">시작하기</button>
  </div>
</div>
</body>
</html>
