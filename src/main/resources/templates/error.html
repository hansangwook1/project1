<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>오류 - 뭐먹을수있지?</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Malgun Gothic', sans-serif; background: #f5f5f5; }
    .navbar {
      background-color: #3d7a3d; padding: 12px 24px;
      display: flex; align-items: center;
    }
    .navbar-brand { color: white; font-size: 18px; font-weight: bold; text-decoration: none; }
    .wrapper {
      display: flex; justify-content: center; align-items: center;
      min-height: calc(100vh - 52px); padding: 40px 16px;
    }
    .card {
      background: white; border-radius: 16px; padding: 48px 40px;
      width: 100%; max-width: 480px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
    }
    .error-icon { font-size: 52px; margin-bottom: 16px; }
    .error-title { font-size: 20px; font-weight: bold; color: #c0392b; margin-bottom: 12px; }
    .error-msg {
      font-size: 14px; color: #666; margin-bottom: 28px;
      background: #fff0f0; border: 1px solid #ffcccc;
      padding: 12px 16px; border-radius: 8px;
    }
    .btn-back {
      background: #3d7a3d; color: white; border: none;
      padding: 12px 32px; border-radius: 8px; font-size: 15px;
      font-weight: bold; cursor: pointer;
    }
    .btn-back:hover { background: #2d5a2d; }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="navbar-brand">🥗 뭐먹을수있지?</a>
</nav>

<div class="wrapper">
  <div class="card">
    <div class="error-icon">⚠️</div>
    <div class="error-title">오류가 발생했습니다</div>
    <div class="error-msg" th:text="${errorMessage}">오류 메시지</div>
    <button class="btn-back" onclick="history.back()">이전으로 돌아가기</button>
  </div>
</div>
</body>
</html>
