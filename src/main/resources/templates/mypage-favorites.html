<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>찜한 음식 - 뭐먹을수있지?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; background: #f5f5f5; }
        .navbar { background: #3d7a3d; padding: 12px 32px; display: flex; align-items: center; justify-content: space-between; }
        .navbar-left { display: flex; align-items: center; gap: 28px; }
        .navbar-brand { color: white; font-size: 18px; font-weight: bold; text-decoration: none; }
        .navbar-menu a { color: white; text-decoration: none; font-size: 14px; margin-right: 20px; }
        .navbar-menu a.active { border-bottom: 2px solid #f5a623; padding-bottom: 2px; }
        .navbar-right { display: flex; align-items: center; gap: 12px; color: white; font-size: 14px; }
        .btn-logout { background: transparent; color: white; border: 1px solid white; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .layout { display: flex; min-height: calc(100vh - 52px); }
        .sidebar { width: 220px; background: white; border-right: 1px solid #eee; padding: 24px 0; }
        .sidebar-profile { text-align: center; padding: 0 20px 24px; border-bottom: 1px solid #eee; margin-bottom: 16px; }
        .profile-icon { width: 64px; height: 64px; background: #e8f5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 10px; }
        .profile-name { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
        .profile-email { font-size: 12px; color: #888; }
        .sidebar-menu a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; font-size: 14px; color: #555; text-decoration: none; }
        .sidebar-menu a:hover { background: #f5f5f5; }
        .sidebar-menu a.active { background: #f0f8f0; color: #3d7a3d; font-weight: bold; border-right: 3px solid #3d7a3d; }
        .content { flex: 1; padding: 32px 40px; }
        .content-title { font-size: 20px; font-weight: bold; margin-bottom: 24px; }
        .alert-success { background: #3d7a3d; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .alert-success .close-btn { background: none; border: none; color: white; cursor: pointer; font-size: 16px; }
        .alert-error { background: #fff0f0; border: 1px solid #ffcccc; color: #c0392b; padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 8px; }
        .form-group input { width: 100%; max-width: 500px; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fafafa; outline: none; }
        .form-group input:focus { border-color: #3d7a3d; background: white; }
        .form-group input:disabled { background: #eee; color: #888; cursor: not-allowed; }
        .form-group input::placeholder { color: #bbb; }
        .section-divider { border: none; border-top: 1px solid #eee; margin: 28px 0; }
        .section-subtitle { font-size: 16px; font-weight: bold; margin-bottom: 20px; }
        .btn-save { background: #3d7a3d; color: white; border: none; padding: 13px 32px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-save:hover { background: #2d5a2d; }
        .fav-empty { background: white; border-radius: 12px; padding: 40px; text-align: center; color: #888; font-size: 14px; }
        .fav-item { display: flex; align-items: center; justify-content: space-between; background: white; border-radius: 10px; padding: 16px 20px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); max-width: 640px; }
        .fav-name { font-size: 15px; font-weight: bold; color: #333; cursor: pointer; }
        .fav-name:hover { color: #3d7a3d; }
        .fav-date { font-size: 12px; color: #888; margin-top: 4px; }
        .btn-unfav { background: white; color: #e74c3c; border: 1px solid #e74c3c; padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .btn-unfav:hover { background: #fff0f0; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-left">
        <a href="/" class="navbar-brand">🥗 뭐먹을수있지?</a>
        <div class="navbar-menu">
            <a href="/">홈</a>
            <a href="/food">음식 검색</a>
            <a href="/mypage/allergy" class="active">마이페이지</a>
        </div>
    </div>
    <div class="navbar-right">
        <span sec:authentication="name"></span>님
        <form action="/logout" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">로그아웃</button>
        </form>
    </div>
</nav>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-profile">
            <div class="profile-icon">👤</div>
            <div class="profile-name" th:text="${user.nickname}">닉네임</div>
            <div class="profile-email" th:text="${user.email}">이메일</div>
        </div>
        <div class="sidebar-menu">
            <a href="/mypage/allergy">🚫 알레르기 관리</a>
            <a href="/mypage/info">🔒 회원정보 수정</a>
            <a href="/mypage/favorites" class="active">♥ 찜한 음식</a>
            <a href="/mypage/history">🕘 내 검색 기록</a>
        </div>
    </div>

    <div class="content">
        <div class="content-title">찜한 음식</div>

        <div class="fav-empty" th:if="${favorites.isEmpty()}">
            아직 찜한 음식이 없어요. 음식 상세 화면에서 ♡ 찜하기를 눌러보세요.
        </div>

        <div th:each="f : ${favorites}" class="fav-item" th:id="'fav-' + ${fStat.index}">
            <div>
                <div class="fav-name" th:text="${f.foodName}"
                     th:data-foodcode="${f.foodCode}" th:data-foodname="${f.foodName}"
                     onclick="goDetail(this)">음식명</div>
                <div class="fav-date" th:text="${#temporals.format(f.createdAt, 'yyyy.MM.dd HH:mm')} + ' 찜함'"></div>
            </div>
            <button type="button" class="btn-unfav"
                    th:data-foodcode="${f.foodCode}" th:data-row="'fav-' + ${fStat.index}"
                    onclick="removeFavorite(this)">찜 취소</button>
        </div>
    </div>
</div>

<script>
    // 음식명 클릭 → 상세 화면 (기존 상세 URL 규칙: Base64(URL인코딩 값))
    function goDetail(el) {
        const foodCode = btoa(encodeURIComponent(el.dataset.foodcode));
        const keyword = btoa(encodeURIComponent(el.dataset.foodname));
        location.href = '/food/detail?foodCode=' + foodCode + '&keyword=' + keyword;
    }

    // 찜 취소 → DELETE /api/favorites/{foodCode}
    async function removeFavorite(btn) {
        if (!confirm('찜을 취소할까요?')) return;
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        const res = await fetch('/api/favorites/' + encodeURIComponent(btn.dataset.foodcode), {
            method: 'DELETE',
            headers: { [csrfHeader]: csrfToken }
        });

        if (res.ok) {
            document.getElementById(btn.dataset.row).remove();
            if (document.querySelectorAll('.fav-item').length === 0) location.reload();
        } else {
            const err = await res.json().catch(() => ({}));
            alert(err.message || '처리 중 오류가 발생했습니다.');
        }
    }
</script>
</body>
</html>
