<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>알레르기 관리 - 뭐먹을수있지?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; background: #f5f5f5; }
        .navbar {
            background: #3d7a3d; padding: 12px 32px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .navbar-left { display: flex; align-items: center; gap: 28px; }
        .navbar-brand { color: white; font-size: 18px; font-weight: bold; text-decoration: none; }
        .navbar-menu a { color: white; text-decoration: none; font-size: 14px; margin-right: 20px; }
        .navbar-menu a.active { border-bottom: 2px solid #f5a623; padding-bottom: 2px; }
        .navbar-right { display: flex; align-items: center; gap: 12px; color: white; font-size: 14px; }
        .btn-logout {
            background: transparent; color: white; border: 1px solid white;
            padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
        }
        .layout { display: flex; min-height: calc(100vh - 52px); }
        .sidebar {
            width: 220px; background: white; border-right: 1px solid #eee;
            padding: 24px 0;
        }
        .sidebar-profile { text-align: center; padding: 0 20px 24px; border-bottom: 1px solid #eee; margin-bottom: 16px; }
        .profile-icon { width: 64px; height: 64px; background: #e8f5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 10px; }
        .profile-name { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
        .profile-email { font-size: 12px; color: #888; }
        .sidebar-menu a {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 20px; font-size: 14px; color: #555;
            text-decoration: none;
        }
        .sidebar-menu a:hover { background: #f5f5f5; }
        .sidebar-menu a.active { background: #f0f8f0; color: #3d7a3d; font-weight: bold; border-right: 3px solid #3d7a3d; }
        .content { flex: 1; padding: 32px 40px; }
        .content-title { font-size: 20px; font-weight: bold; margin-bottom: 24px; }
        .alert-success {
            background: #3d7a3d; color: white; padding: 12px 20px;
            border-radius: 8px; font-size: 14px; margin-bottom: 20px;
        }
        .alert-error {
            background: #fff0f0; border: 1px solid #ffcccc; color: #c0392b;
            padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
        }
        .section-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 12px; }
        .allergy-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .allergy-tag {
            display: flex; align-items: center; gap: 6px;
            background: #f0f8f0; border: 1px solid #3d7a3d; color: #3d7a3d;
            padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
        }
        .allergy-tag.selected { background: #3d7a3d; color: white; }
        .allergy-tag .remove { cursor: pointer; font-size: 14px; }
        .add-custom-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .add-custom-row input {
            flex: 1; padding: 10px 14px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 14px; background: #fafafa; outline: none;
        }
        .add-custom-row input:focus { border-color: #3d7a3d; background: white; }
        .btn-add {
            background: white; border: 1px solid #3d7a3d; color: #3d7a3d;
            padding: 10px 16px; border-radius: 8px; font-size: 13px;
            cursor: pointer; font-weight: bold; white-space: nowrap;
        }
        .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
        .btn-save {
            background: #3d7a3d; color: white; border: none;
            padding: 13px 32px; border-radius: 8px; font-size: 15px;
            font-weight: bold; cursor: pointer;
        }
        .btn-save:hover { background: #2d5a2d; }
        .custom-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: white; border-radius: 8px;
            border: 1px solid #eee; margin-bottom: 8px;
        }
        .custom-item-left { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .btn-delete {
            background: white; border: 1px solid #ddd; color: #e74c3c;
            padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-left">
        <a href="/" class="navbar-brand">🥗 뭐먹을수있지?</a>
        <div class="navbar-menu">
            <a href="/">홈</a>
            <a href="/food">음식 검색</a>
            <a href="/mypage/allergy" class="active">마이페이지</a>
        </div>
    </div>
    <div class="navbar-right">
        <span sec:authentication="name"></span>님
        <form action="/logout" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">로그아웃</button>
        </form>
    </div>
</nav>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-profile">
            <div class="profile-icon">👤</div>
            <div class="profile-name" th:text="${user.nickname}">닉네임</div>
            <div class="profile-email" th:text="${user.email}">이메일</div>
        </div>
        <div class="sidebar-menu">
            <a href="/mypage/allergy" class="active">🚫 알레르기 관리</a>
            <a href="/mypage/info">🔒 회원정보 수정</a>
        </div>
    </div>

    <div class="content">
        <div class="content-title">알레르기 관리</div>

        <div class="alert-success" th:if="${successMessage}" th:text="'✅ ' + ${successMessage}"></div>
        <div class="alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form action="/mypage/allergy" method="post" id="allergyForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- 기본 알레르기 항목 -->
            <div class="section-title">기본 알레르기 항목</div>
            <div class="allergy-tags" id="basicTags">
                <div th:each="item : ${allItems}"
                     class="allergy-tag"
                     th:classappend="${selectedIds.contains(item.allergyId)} ? ' selected' : ''"
                     th:data-id="${item.allergyId}"
                     th:text="${item.name}"
                     onclick="toggleAllergy(this)">
                </div>
            </div>
            <div id="basicHiddens"></div>

            <hr class="divider"/>

            <!-- 직접 추가 알레르기 -->
            <div class="section-title">직접 추가한 알레르기</div>
            <div class="allergy-tags" id="customTags">
                <div th:each="a : ${customAllergies}"
                     class="allergy-tag selected"
                     th:data-name="${a.customName}">
                    <span th:text="${a.customName}"></span>
                    <span class="remove" onclick="removeCustom(this)">×</span>
                    <input type="hidden" name="customNames" th:value="${a.customName}"/>
                </div>
            </div>
            <div class="add-custom-row">
                <input type="text" id="customInput" placeholder="직접 알레르기 입력"/>
                <button type="button" class="btn-add" onclick="addCustom()">+ 추가</button>
            </div>

            <button type="submit" class="btn-save" onclick="prepareSubmit()">저장</button>
        </form>
    </div>
</div>

<script>
    // 기본 항목 토글
    function toggleAllergy(el) {
        el.classList.toggle('selected');
    }

    // 직접 추가
    function addCustom() {
        const val = document.getElementById('customInput').value.trim();
        if (!val) return;
        const tag = document.createElement('div');
        tag.className = 'allergy-tag selected';
        tag.dataset.name = val;
        tag.innerHTML = `<span>${val}</span><span class="remove" onclick="removeCustom(this)">×</span><input type="hidden" name="customNames" value="${val}"/>`;
        document.getElementById('customTags').appendChild(tag);
        document.getElementById('customInput').value = '';
    }

    // 직접 추가 항목 삭제
    function removeCustom(el) {
        el.parentElement.remove();
    }

    // 폼 submit 전 기본 항목 hidden input 생성
    function prepareSubmit() {
        const container = document.getElementById('basicHiddens');
        container.innerHTML = '';
        document.querySelectorAll('#basicTags .allergy-tag.selected').forEach(el => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'allergyIds';
            input.value = el.dataset.id;
            container.appendChild(input);
        });
    }

    document.getElementById('customInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addCustom(); }
    });
</script>
</body>
</html>
