<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>알레르기 설정 - 뭐먹을수있지?</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Malgun Gothic', sans-serif; background: #f5f5f5; }
    .navbar {
      background-color: #3d7a3d; padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .navbar-left { display: flex; align-items: center; gap: 24px; }
    .navbar-brand { color: white; font-size: 18px; font-weight: bold; text-decoration: none; }
    .navbar-menu a { color: white; text-decoration: none; font-size: 14px; margin-right: 16px; }
    .btn-login-nav {
      background: transparent; color: white; border: 1px solid white;
      padding: 7px 18px; border-radius: 6px; font-size: 14px; cursor: pointer;
    }
    .wrapper {
      display: flex; justify-content: center;
      min-height: calc(100vh - 52px); padding: 40px 16px;
    }
    .card {
      background: white; border-radius: 16px; padding: 40px;
      width: 100%; max-width: 560px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      height: fit-content;
    }
    .card-title { font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 6px; }
    .card-subtitle { font-size: 13px; color: #888; text-align: center; margin-bottom: 24px; }

    /* 스텝 */
    .steps { display: flex; align-items: center; justify-content: center; margin-bottom: 32px; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .step-circle {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: bold;
    }
    .step.done .step-circle { background: #3d7a3d; color: white; }
    .step.active .step-circle { background: #3d7a3d; color: white; }
    .step.inactive .step-circle { background: #ddd; color: #999; }
    .step-label { font-size: 12px; color: #999; }
    .step.active .step-label { color: #3d7a3d; font-weight: bold; }
    .step.done .step-label { color: #999; }
    .step-line { width: 60px; height: 2px; background: #3d7a3d; margin-bottom: 18px; }
    .step-line.inactive { background: #ddd; }

    /* 알레르기 체크박스 */
    .section-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 12px; }
    .allergy-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 24px;
    }
    .allergy-item { display: flex; align-items: center; gap: 8px; }
    .allergy-item input[type=checkbox] {
      width: 18px; height: 18px; accent-color: #3d7a3d; cursor: pointer;
    }
    .allergy-item label { font-size: 14px; color: #333; cursor: pointer; }
    .divider { border: none; border-top: 1px solid #eee; margin-bottom: 20px; }

    /* 직접 추가 */
    .custom-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .custom-input-row input {
      flex: 1; padding: 11px 14px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; background: #fafafa; outline: none;
    }
    .custom-input-row input:focus { border-color: #3d7a3d; background: white; }
    .custom-input-row input::placeholder { color: #bbb; }
    .btn-add {
      background: white; border: 1px solid #3d7a3d; color: #3d7a3d;
      padding: 11px 16px; border-radius: 8px; font-size: 13px;
      cursor: pointer; font-weight: bold; white-space: nowrap;
    }
    .btn-add:hover { background: #f0f8f0; }
    .custom-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; min-height: 10px; }
    .custom-tag {
      background: #f0f8f0; border: 1px solid #3d7a3d; color: #3d7a3d;
      padding: 4px 10px; border-radius: 20px; font-size: 13px;
      display: flex; align-items: center; gap: 6px;
    }
    .custom-tag button {
      background: none; border: none; color: #e74c3c;
      cursor: pointer; font-size: 14px; padding: 0; line-height: 1;
    }

    /* 버튼 */
    .btn-area { display: flex; gap: 12px; }
    .btn-prev {
      flex: 1; background: white; border: 1px solid #ddd; color: #666;
      padding: 14px; border-radius: 8px; font-size: 15px; cursor: pointer;
    }
    .btn-prev:hover { background: #f5f5f5; }
    .btn-next {
      flex: 2; background: #3d7a3d; color: white; border: none;
      padding: 14px; border-radius: 8px; font-size: 15px;
      font-weight: bold; cursor: pointer;
    }
    .btn-next:hover { background: #2d5a2d; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-left">
    <a href="/" class="navbar-brand">🥗 뭐먹을수있지?</a>
    <div class="navbar-menu"><a href="/">홈</a></div>
  </div>
  <button class="btn-login-nav" onclick="location.href='/login'">로그인</button>
</nav>

<div class="wrapper">
  <div class="card">
    <div class="card-title">알레르기 항목 선택</div>
    <div class="card-subtitle">해당하는 알레르기를 모두 선택해주세요</div>

    <div class="steps">
      <div class="step done">
        <div class="step-circle">✓</div>
        <div class="step-label">기본 정보</div>
      </div>
      <div class="step-line"></div>
      <div class="step active">
        <div class="step-circle">2</div>
        <div class="step-label">알레르기 설정</div>
      </div>
      <div class="step-line inactive"></div>
      <div class="step inactive">
        <div class="step-circle">3</div>
        <div class="step-label">가입 완료</div>
      </div>
    </div>

    <form id="allergyForm" action="/join" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="email" th:value="${param.email}"/>
      <input type="hidden" name="password" th:value="${param.password}"/>
      <input type="hidden" name="passwordConfirm" th:value="${param.passwordConfirm}"/>
      <input type="hidden" name="nickname" th:value="${param.nickname}"/>

      <div class="section-title">기본 알레르기 항목 (<span th:text="${allergyItems.size()}"></span>개)</div>
      <div class="allergy-grid">
        <div class="allergy-item" th:each="item : ${allergyItems}">
          <input type="checkbox" name="allergyIds"
                 th:value="${item.allergyId}" th:id="${item.code}"/>
          <label th:for="${item.code}" th:text="${item.name}"></label>
        </div>
      </div>

      <hr class="divider"/>

      <div class="section-title">직접 추가</div>
      <div class="custom-input-row">
        <input type="text" id="customInput" placeholder="목록에 없는 알레르기 직접 입력"/>
        <button type="button" class="btn-add" onclick="addCustom()">+ 추가</button>
      </div>
      <div class="custom-tags" id="customTags"></div>

      <div class="btn-area">
        <button type="button" class="btn-prev" onclick="history.back()">← 이전</button>
        <button type="submit" class="btn-next">다음 →</button>
      </div>
    </form>
  </div>
</div>

<script>
  function addCustom() {
    const val = document.getElementById('customInput').value.trim();
    if (!val) return;

    const tag = document.createElement('div');
    tag.className = 'custom-tag';
    tag.innerHTML = `
            <span>${val}</span>
            <input type="hidden" name="customAllergies" value="${val}"/>
            <button type="button" onclick="this.parentElement.remove()">×</button>
        `;
    document.getElementById('customTags').appendChild(tag);
    document.getElementById('customInput').value = '';
  }

  document.getElementById('customInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); addCustom(); }
  });
</script>
</body>
</html>
